<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200px" height="1200px" viewBox="0 0 1200 1200" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1116"/>
      <stop offset="1" stop-color="#1c2026"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect fill="url(#bg)" x="0" y="0" width="1200" height="1200"/>

  <!-- terminal prompt chevron -->
  <polygon points="300,600 560,380 560,420 360,600 560,780 560,820" fill="url(#accent)" filter="url(#glow)"/>

  <!-- tab / cursor block -->
  <rect x="620" y="380" width="180" height="440" rx="24" fill="url(#accent)" filter="url(#glow)"/>
</svg>